name: Build Los Angeles rent post
on:
  push:
    branches: [build/blog-post-5-20261019]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Install analysis packages
        run: python -m pip install -r blog/posts/post5/requirements.txt
      - name: Acquire official data and reproduce analysis
        run: |
          python blog/posts/post5/code/fetch.py
          python blog/posts/post5/code/analyze.py
          python blog/posts/post5/code/write_post.py
      - name: Verify reviewed numerical results
        run: >-
          python -c "import hashlib,json;from pathlib import Path;p=Path('blog/posts/post5');expected={'acs_tracts.json': 'ad0a2d26590da57560b7aeabf07cf9fc63f23c23250b8513430559ecb889c013', 'acs_county.json': 'af763fd5be2bef84eeca7793e046b8e4cb86b8ff8667f665f81e046f2c3b8a35'};assert all(hashlib.sha256((p/'data/raw'/k).read_bytes()).hexdigest()==v for k,v in expected.items());s=json.loads((p/'results/summary.json').read_text());assert s['tracts_included']==2325 and abs(s['county']['burden_pct']-57.66385818394898)<1e-8;print('Data snapshot and main results match the reviewed analysis')"
      - name: Render article and blog listing
        run: |
          quarto render blog/posts/post5/index.qmd
          quarto render blog/index.qmd
      - name: Save compiled site and data snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/posts/post5 docs
          git commit -m 'Build Los Angeles rent maps and article'
          git push origin HEAD:build/blog-post-5-20261019
